name: terisbutak-map-scenarios
on:
  workflow_dispatch:
  push:
    branches: [terisbutak-map-scenarios]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest openpyxl matplotlib
      - run: python -m pytest -q
  package:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install matplotlib
      - run: python scripts/terisbutak_map.py OUTPUTS/map
      - run: python scripts/terisbutak_water.py OUTPUTS/water
      - run: cp docs/terisbutak_monograph_paragraph.md OUTPUTS/
      - name: summary
        if: always()
        run: |
          { echo "### Сценарии"; cat OUTPUTS/water/Check_Report_Scenarios.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terisbutak-map-scenarios-outputs
          path: OUTPUTS
