name: station-v5
on:
  workflow_dispatch:
  push:
    branches: [v5-station-actions]
permissions:
  contents: read
jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - name: pytest
        run: python -m pytest -q -rA --junitxml=pytest.xml | tee pytest.log
      - name: reconciliation vs reference JSON
        run: |
          python scripts/run_reconciliation.py > reconciliation_new.json
          python - <<'PY'
          import json
          a = json.load(open('reconciliation_new.json'))
          b = json.load(open('results/reconciliation.json'))
          assert a == b, 'reconciliation.json расходится с эталоном'
          print('reconciliation: совпадает с results/reconciliation.json')
          PY
      - name: geometry test status
        run: |
          grep -E "PASSED|SKIPPED|FAILED" pytest.log | grep -E "cadastre|96_points|streamlit" | tee geometry_status.txt
          { echo "### Геометрические тесты"; echo '```'; cat geometry_status.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: repo-checks
          path: |
            pytest.xml
            pytest.log
            reconciliation_new.json
            geometry_status.txt
  station-v5:
    # Включается переменными DNRE_STATION_INPUT=enabled, DNRE_INPUT_REPO (владелец/приватный репозиторий) и секретом DNRE_INPUT_TOKEN.
    if: ${{ vars.DNRE_STATION_INPUT == 'enabled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas numpy scipy matplotlib
      - name: fetch private bundle (v5 package + three CSV)
        env:
          INPUT_TOKEN: ${{ secrets.DNRE_INPUT_TOKEN }}
          INPUT_REPO: ${{ vars.DNRE_INPUT_REPO }}
        run: |
          mkdir -p work
          [ -n "$INPUT_TOKEN" ] || { echo "::error::секрет DNRE_INPUT_TOKEN пуст или не создан"; exit 1; }
          [ -n "$INPUT_REPO" ] || { echo "::error::переменная DNRE_INPUT_REPO пуста или не создана"; exit 1; }
          code=$(curl -sS -o work/list.json -w '%{http_code}' -H "Authorization: Bearer $INPUT_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$INPUT_REPO/contents/")
          if [ "$code" != "200" ]; then
            echo "::error::список файлов в $INPUT_REPO: HTTP $code (401 токен неверен или истёк; 403 нет прав Contents:read; 404 репозиторий не найден или токен выдан на другой репозиторий)"
            exit 1
          fi
          names=$(python3 -c "import json;print(' | '.join(x['name'] for x in json.load(open('work/list.json'))))")
          zipname=$(python3 -c "import json;z=[x['name'] for x in json.load(open('work/list.json')) if x['name'].lower().endswith('.zip')];print(z[0] if len(z)==1 else '')")
          [ -n "$zipname" ] || { echo "::error::в корне $INPUT_REPO нет ровно одного .zip; файлы: $names"; exit 1; }
          echo "Найден файл: $zipname"
          curl -fsSL -H "Authorization: Bearer $INPUT_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$INPUT_REPO/contents/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$zipname")" -o work/bundle.zip
          cd work && unzip -q bundle.zip
          test -f Input_SHA256.txt && test -f v5/analysis_v5.py && test -d INPUTS
          (cd INPUTS && sha256sum -c ../Input_SHA256.txt)
      - name: run analysis_v5
        working-directory: work
        run: |
          OPENBLAS_NUM_THREADS=1 python v5/analysis_v5.py INPUTS OUTPUTS
      - name: compare with v5 references
        working-directory: work
        run: python ../scripts/compare_v5.py v5 OUTPUTS compare_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-v5-outputs
          path: |
            work/OUTPUTS
            work/compare_report.md
